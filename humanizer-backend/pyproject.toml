[project]
name = "humanizer-backend"
version = "0.1.0"
description = "API para humanizar texto generado por LLMs"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.95.2",
    "uvicorn[standard]>=0.22.0",
    "httpx>=0.24.0",
    "textstat>=0.7.1",
    "python-dotenv>=1.0.0",
    "pydantic>=1.10.12",
    "structlog>=23.3.0",
    "prometheus-client>=0.16.0",
    "redis>=4.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["app"]
