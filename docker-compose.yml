version: '3.8'

services:
  api:
    build:
      context: ./humanizer-backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENV=development
      - LOG_LEVEL=INFO
      - REDIS_URL=redis://redis:6379/0
      - RATE_LIMIT_REQUESTS=60
      - RATE_LIMIT_WINDOW=60
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
